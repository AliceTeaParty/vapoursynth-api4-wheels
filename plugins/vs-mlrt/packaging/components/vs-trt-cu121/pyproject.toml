[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vs-trt-cu121"
version = "16.2.2"
requires-python = ">=3.12"
description = "TensorRT 8.6 VapourSynth plugin for vs-mlrt"
dependencies = ["vs-tensorrt-core-cu121==16.2.2"]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.hooks.custom]
path = "../component_hook.py"

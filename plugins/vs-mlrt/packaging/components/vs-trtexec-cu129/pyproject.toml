[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vs-trtexec-cu129"
version = "16.2.2"
requires-python = ">=3.12"
description = "TensorRT 11.1 engine builder for vs-mlrt"
dependencies = [
  "vs-tensorrt-core-cu129==16.2.2",
  "vs-tensorrt-builder-cu129-base==16.2.2",
  "vs-tensorrt-builder-cu129-modern==16.2.2",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.hooks.custom]
path = "../component_hook.py"

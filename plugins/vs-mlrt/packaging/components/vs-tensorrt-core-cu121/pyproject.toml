[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vs-tensorrt-core-cu121"
version = "16.2.2+alice.1"
requires-python = ">=3.12"
description = "TensorRT 8.6 runtime for vs-mlrt"
dependencies = ["vs-cublas-cu121==16.2.2+alice.1", "vs-cudnn-cu121==16.2.2+alice.1"]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.hooks.custom]
path = "../component_hook.py"

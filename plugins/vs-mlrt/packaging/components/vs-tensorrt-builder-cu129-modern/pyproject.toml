[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vs-tensorrt-builder-cu129-modern"
version = "16.2.2"
requires-python = ">=3.12"
description = "TensorRT 11.1 SM90-SM120 builder resources for vs-mlrt"
dependencies = ["vs-tensorrt-core-cu129==16.2.2"]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.hooks.custom]
path = "../component_hook.py"

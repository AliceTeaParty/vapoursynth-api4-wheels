[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vs-mlrt-cu121"
version = "16.2.3"
description = "VapourSynth ML runtime tools with CUDA 12.1 backends"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
  "vapoursynth>=75",
  "numpy",
  "onnx",
  "onnxconverter-common",
  "vs-mlrt-models==16.2.3",
  "vs-ov==16.2.3",
  "vs-ncnn==16.2.3",
  "vs-cublas-cu121==16.2.3",
  "vs-cudnn-cu121==16.2.3",
  "vs-tensorrt-core-cu121==16.2.3",
  "vs-tensorrt-builder-cu121==16.2.3",
  "vs-trtexec-cu121==16.2.3",
  "vs-trt-cu121==16.2.3",
]

[project.scripts]
rm_vsmlrt = "rm_vsmlrt.cli:console_main"

[project.urls]
"Source Code" = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/tree/main/plugins/vs-mlrt"
"Releases" = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/releases/tag/vs-mlrt-cu121-v16.2.3"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

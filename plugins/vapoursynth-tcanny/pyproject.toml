[build-system]
requires = ["hatchling>=1.30", "packaging>=24.0", "py7zr>=0.21", "meson>=0.51", "ninja", "VapourSynth>=77"]
build-backend = "hatchling.build"

[project]
name = "vapoursynth-tcanny"
version = "14.1"
description = "TCanny edge detection plugin for VapourSynth"
readme = "README.md"
license = { file = "LICENSE" }
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "TCanny contributors" }]
dependencies = ["VapourSynth>=77"]

[project.urls]
"Source Code" = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/tree/main/plugins/vapoursynth-tcanny"
"Releases" = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/releases/tag/vapoursynth-tcanny-v14.1"
"Upstream" = "https://github.com/HomeOfVapourSynthEvolution/VapourSynth-TCanny"

[tool.hatch.build.targets.sdist]
include = [
  "LICENSE",
  "README.md",
  "TCanny",
  "hatch_build.py",
  "meson.build",
  "pyproject.toml",
  "tools",
]

[tool.hatch.build.targets.wheel]
include = ["vapoursynth/plugins"]
artifacts = [
  "vapoursynth/plugins/**/*.dll",
  "vapoursynth/plugins/**/*.so",
  "vapoursynth/plugins/**/*.dylib",
  "vapoursynth/plugins/**/manifest.vs",
  "vapoursynth/plugins/**/LICENSE",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[build-system]
requires = ["hatchling>=1.30", "packaging>=24.0"]
build-backend = "hatchling.build"

[project]
name = "vs-nlq"
version = "1.2.0"
description = "NLQ mapping plugin for VapourSynth"
readme = "README.md"
license = { file = "LICENSE" }
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "quietvoid" }]
dependencies = ["VapourSynth>=77"]

[project.urls]
"Source Code" = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/tree/main/plugins/vs-nlq"
"Releases" = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/releases/tag/vs-nlq-v1.2.0"

[tool.hatch.build.targets.sdist]
include = [
  "Cargo.lock",
  "Cargo.toml",
  "LICENSE",
  "README.md",
  "VERIFICATION.md",
  "hatch_build.py",
  "pyproject.toml",
  "src",
  "test.vpy",
  "tools",
]

[tool.hatch.build.targets.wheel]
include = ["vapoursynth/plugins"]
artifacts = [
  "vapoursynth/plugins/**/*.dll",
  "vapoursynth/plugins/**/*.so",
  "vapoursynth/plugins/**/*.dylib",
  "vapoursynth/plugins/**/manifest.vs",
  "vapoursynth/plugins/**/LICENSE",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

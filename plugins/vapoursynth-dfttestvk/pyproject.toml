[build-system]
requires = ["hatchling>=1.30", "packaging>=24", "cmake>=3.20", "ninja", "VapourSynth>=81"]
build-backend = "hatchling.build"

[project]
name = "vapoursynth-dfttestvk"
version = "0.1.0"
description = "Vulkan frequency-domain denoising for VapourSynth"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY.md"]
requires-python = ">=3.12"
dependencies = ["VapourSynth>=81"]

[project.urls]
"Source Code" = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/tree/main/plugins/vapoursynth-dfttestvk"
"Upstream" = "https://github.com/RyougiKukoc/vapoursynth-dfttestvk"
"Releases" = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/releases/tag/vapoursynth-dfttestvk-v0.1.0"

[tool.hatch.build.targets.wheel]
only-include = ["vapoursynth/plugins/dfttestvk"]
artifacts = ["vapoursynth/plugins/dfttestvk/**"]

[tool.hatch.build.targets.sdist]
include = ["pyproject.toml", "hatch_build.py", "README.md", "LICENSE", "THIRD_PARTY.md", "source.json"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[build-system]
requires = ["hatchling>=1.30", "packaging>=24.0", "meson>=0.49", "ninja", "VapourSynth>=79"]
build-backend = "hatchling.build"

[project]
name = "vapoursynth-fft3dfilter"
version = "2.1"
description = "FFT3DFilter frequency-domain denoising and sharpening plugin for VapourSynth"
readme = "README.md"
license = { text = "GPL-2.0-only" }
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "FFT3DFilter contributors" }]
dependencies = ["VapourSynth>=79"]

[project.urls]
"Source Code" = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/tree/main/plugins/vapoursynth-fft3dfilter"
"Releases" = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/releases/tag/vapoursynth-fft3dfilter-v2.1"

[tool.fft3dfilter.release]
# This source marker is authoritative for the Release-backed VCS installer.
# It is intentionally consulted before legacy R<version>/v<version> guesses.
tag = "vapoursynth-fft3dfilter-v2.1"

[tool.hatch.build.targets.sdist]
include = [
  "FFT3DFilter.cpp",
  "FFT3DFilter.h",
  "FFT3DFilterTransform.cpp",
  "LICENSE",
  "Plugin.cpp",
  "README.md",
  "doc",
  "fft3dfilter_c.cpp",
  "hatch_build.py",
  "meson.build",
  "meson_options.txt",
  "msvc",
  "pyproject.toml",
  "tools",
]

[tool.hatch.build.targets.wheel]
include = ["vapoursynth/plugins"]
artifacts = [
  "vapoursynth/plugins/**/*.dll",
  "vapoursynth/plugins/**/*.so",
  "vapoursynth/plugins/**/*.so.*",
  "vapoursynth/plugins/**/*.dylib",
  "vapoursynth/plugins/**/manifest.vs",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[build-system]
requires = ["hatchling>=1.30", "packaging>=24.0", "meson>=0.49", "ninja", "VapourSynth>=79"]
build-backend = "hatchling.build"

[project]
name = "vapoursynth-retinex"
version = "4.1"
description = "Retinex dynamic range compression and color constancy plugin for VapourSynth"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Retinex contributors" }]
dependencies = ["VapourSynth>=77"]

[project.urls]
"Source Code" = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/tree/main/plugins/vapoursynth-retinex"
"Releases" = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/releases/tag/vapoursynth-retinex-v4.1"

[tool.hatch.build.targets.sdist]
include = [
  ".github/workflows/build-msys2.yml",
  "hatch_build.py",
  "include",
  "LICENSE",
  "meson.build",
  "msvc",
  "pyproject.toml",
  "README.md",
  "source",
  "tools",
]

[tool.hatch.build.targets.wheel]
include = ["vapoursynth/plugins"]
artifacts = [
  "vapoursynth/plugins/**/*.dll",
  "vapoursynth/plugins/**/*.so",
  "vapoursynth/plugins/**/*.dylib",
  "vapoursynth/plugins/**/manifest.vs",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

name: Validate - KrigBilateral physical GPU

on:
  workflow_dispatch:
    inputs:
      runner_labels:
        description: 'JSON runner labels; use the configured hosted GPU label or a Linux self-hosted GPU'
        required: true
        type: string
        default: '["self-hosted","linux","x64","nvidia-vulkan-1.4"]'
      release_tag:
        description: 'Central release matching the source/version in this checkout'
        required: true
        type: string
        default: 'vapoursynth-krigbilateralvk-v0.3.1'
      environment_prefix:
        description: 'Optional existing Python/mamba environment prefix; empty uses Docker'
        required: false
        type: string
        default: ''
      device_index:
        description: 'Optional Vulkan device index for a shared GPU runner; empty selects automatically'
        required: false
        type: string
        default: ''
  pull_request:
    paths:
      - .github/workflows/validate-krigbilateralvk-gpu.yml
      - plugins/vapoursynth-krigbilateralvk/tools/hardware_device.py
      - plugins/vapoursynth-krigbilateralvk/tools/linux_hardware_smoke.sh
      - plugins/vapoursynth-krigbilateralvk/tools/smoke_installed.py
      - tests/test_krig_gpu_validation.py

permissions:
  contents: read

jobs:
  guard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_krig_gpu_validation.py -v
      - run: sh -n plugins/vapoursynth-krigbilateralvk/tools/linux_hardware_smoke.sh

  linux-gpu:
    if: github.event_name == 'workflow_dispatch'
    needs: guard-tests
    runs-on: ${{ fromJSON(inputs.runner_labels || '["self-hosted","linux","x64","nvidia-vulkan-1.4"]') }}
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      GPU_ENV_PREFIX: ${{ inputs.environment_prefix }}
      KRIGVK_TEST_DEVICE_INDEX: ${{ inputs.device_index }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: plugins/vapoursynth-krigbilateralvk
      - name: Configure the optional native Python environment
        if: inputs.environment_prefix != ''
        shell: bash
        run: |
          set -euo pipefail
          case "$GPU_ENV_PREFIX" in /*) ;; *) echo 'environment_prefix must be absolute' >&2; exit 1 ;; esac
          test -x "$GPU_ENV_PREFIX/bin/python"
          mkdir -p "$GPU_ENV_PREFIX/../cache" "$GPU_ENV_PREFIX/../tmp" "$GPU_ENV_PREFIX/../nvidia-cache"
          printf '%s\n' "$GPU_ENV_PREFIX/bin" >> "$GITHUB_PATH"
          printf 'LD_LIBRARY_PATH=%s\n' "$GPU_ENV_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          printf 'XDG_CACHE_HOME=%s\n' "$GPU_ENV_PREFIX/../cache" >> "$GITHUB_ENV"
          printf 'TMPDIR=%s\n' "$GPU_ENV_PREFIX/../tmp" >> "$GITHUB_ENV"
          printf '__GL_SHADER_DISK_CACHE_PATH=%s\n' "$GPU_ENV_PREFIX/../nvidia-cache" >> "$GITHUB_ENV"
      - name: Record the Linux NVIDIA driver
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          mkdir -p .work/krig-gpu-results
          nvidia-smi --query-gpu=name,driver_version --format=csv,noheader | tee .work/krig-gpu-results/nvidia-driver.txt
      - name: Download the released wheel and native payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/krig-gpu-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*-manylinux_2_28_x86_64.whl' \
            --pattern krigbilateralvk-linux-x86_64.zip --dir .work/krig-gpu-assets
      - name: Build the R81 Vulkan validation container
        if: inputs.environment_prefix == ''
        run: docker build -t krig-hardware-validation -f plugins/vapoursynth-krigbilateralvk/linux-validation.Dockerfile .
      - name: Render the released plugin on the physical NVIDIA device
        if: inputs.environment_prefix == ''
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --runtime=nvidia --gpus all \
            -e NVIDIA_DRIVER_CAPABILITIES=graphics,utility \
            -e KRIGVK_TEST_DEVICE_INDEX \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$GITHUB_WORKSPACE/.work/krig-gpu-results:/results" \
            krig-hardware-validation sh /workspace/plugins/vapoursynth-krigbilateralvk/tools/linux_hardware_smoke.sh
      - name: Render the released plugin in the native Python environment
        if: inputs.environment_prefix != ''
        shell: bash
        run: |
          set -euo pipefail
          export KRIGVK_RESULTS_DIR="$GITHUB_WORKSPACE/.work/krig-gpu-results"
          export KRIGVK_STAGING_PARENT="$GITHUB_WORKSPACE/.work"
          export PIP_CACHE_DIR="$GPU_ENV_PREFIX/../pip-cache"
          sh plugins/vapoursynth-krigbilateralvk/tools/linux_hardware_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krigbilateralvk-physical-gpu-validation
          path: .work/krig-gpu-results
          if-no-files-found: warn

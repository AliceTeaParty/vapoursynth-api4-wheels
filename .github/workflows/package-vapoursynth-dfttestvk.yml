name: Package - vapoursynth-dfttestvk

on:
  push:
    branches: [main]
    tags: ['vapoursynth-dfttestvk-v*']
    paths:
      - .gitmodules
      - plugins/vapoursynth-dfttestvk/**
      - .github/workflows/package-vapoursynth-dfttestvk.yml
  pull_request:
    paths:
      - .gitmodules
      - plugins/vapoursynth-dfttestvk/**
      - .github/workflows/package-vapoursynth-dfttestvk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugins/vapoursynth-dfttestvk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies and R81
        run: python -m pip install build hatchling packaging cmake ninja numpy "VapourSynth>=81"
      - name: Test central source and package validation
        run: python -m unittest discover -s ../../tests -p test_dfttestvk_package.py -v
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build native wheel
        shell: pwsh
        env:
          DFTTESTVK_MSYS_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          DFTTESTVK_FORCE_BUILD: '1'
        run: |
          $compilerDir = Join-Path $env:DFTTESTVK_MSYS_ROOT 'ucrt64/bin'
          $env:PATH = $compilerDir + ';' + $env:PATH
          $env:CXX = (Join-Path $compilerDir 'g++.exe').Replace('\', '/')
          python -m build --wheel --no-isolation --outdir dist/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate and assemble payload
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/release/*.whl | Select-Object -First 1 -ExpandProperty FullName
          python tools/validate_wheel.py --wheel $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/make_assets.py --wheel $wheel --output dist/release/dfttestvk-windows-x86_64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/smoke_installed.py --output dist/release/windows-registration.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Loopback source install using the built payload
        shell: pwsh
        run: |
          python -m pip uninstall -y vapoursynth-dfttestvk
          $env:DFTTESTVK_PREBUILT_URL = (Resolve-Path dist/release/dfttestvk-windows-x86_64.zip).Path
          python -m pip install --no-deps --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/smoke_installed.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: dfttestvk-release-windows
          path: plugins/vapoursynth-dfttestvk/dist/release
          if-no-files-found: error

  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build manylinux_2_28 native wheel
        shell: bash
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            quay.io/pypa/manylinux_2_28_x86_64 bash -lc '
              set -euxo pipefail
              export PATH=/opt/python/cp312-cp312/bin:$PATH
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /workspace/plugins/vapoursynth-dfttestvk/native
              python -m pip install build hatchling packaging cmake ninja
              python -m unittest discover -s tests -p test_dfttestvk_package.py -v
              python plugins/vapoursynth-dfttestvk/native/tools/fetch_dependencies.py --with-vapoursynth --destination .work/dfttestvk-headers
              export DFTTESTVK_VAPOURSYNTH_INCLUDE=/workspace/.work/dfttestvk-headers/vapoursynth/include
              export DFTTESTVK_VULKAN_HEADERS=/workspace/.work/dfttestvk-headers/vulkan-headers/include
              export DFTTESTVK_FORCE_BUILD=1
              export DFTTESTVK_PLATFORM_TAG=manylinux_2_28_x86_64
              cd plugins/vapoursynth-dfttestvk
              python -m build --wheel --no-isolation --skip-dependency-check --outdir dist/release-linux
              wheel=$(find dist/release-linux -name "*.whl" -print -quit)
              python tools/validate_wheel.py --wheel "$wheel" --max-glibc 2.28
              python tools/make_assets.py --wheel "$wheel" --output dist/release-linux/dfttestvk-linux-x86_64.zip
            '
      - uses: actions/upload-artifact@v4
        with:
          name: dfttestvk-release-linux
          path: plugins/vapoursynth-dfttestvk/dist/release-linux
          if-no-files-found: error

  linux-runtime:
    needs: linux-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: dfttestvk-release-linux
          path: plugins/vapoursynth-dfttestvk/dist/release-linux
      - name: Build R81 Vulkan validation environment
        run: docker build -t dfttestvk-r81-validation -f plugins/vapoursynth-dfttestvk/linux-validation.Dockerfile .
      - name: Install wheel and render on Mesa Vulkan
        shell: bash
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" -v "$GITHUB_WORKSPACE/.work/dfttestvk-results:/results" \
            dfttestvk-r81-validation sh -c '
              set -eu
              python -m pip install --no-deps /workspace/plugins/vapoursynth-dfttestvk/dist/release-linux/*.whl
              python /workspace/plugins/vapoursynth-dfttestvk/tools/smoke_installed.py --exercise --oracle-suite full --output /results/linux-render.json
              python -m pip uninstall -y vapoursynth-dfttestvk
              export DFTTESTVK_PREBUILT_URL=/workspace/plugins/vapoursynth-dfttestvk/dist/release-linux/dfttestvk-linux-x86_64.zip
              cp -a /workspace/plugins/vapoursynth-dfttestvk /work/package
              python -m pip install --no-deps --no-build-isolation /work/package
              python /workspace/plugins/vapoursynth-dfttestvk/tools/smoke_installed.py --exercise --oracle-suite smoke --output /results/linux-loopback-render.json
            '
      - uses: actions/upload-artifact@v4
        with:
          name: dfttestvk-linux-runtime-validation
          path: .work/dfttestvk-results
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/vapoursynth-dfttestvk-v')
    needs: [windows, linux-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dfttestvk-release-*
          path: release-assets
          merge-multiple: true
      - name: Publish tested wheels and payloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes 'Central wheels for the pinned DFTTestVK Vulkan submodule. Requires VapourSynth R81 and Vulkan 1.4.'
          gh api "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=index

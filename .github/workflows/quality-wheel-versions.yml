name: Quality - wheel versions

on:
  pull_request:
    paths:
      - '**/pyproject.toml'
      - '**/hatch_build.py'
      - plugins/vs-mlrt/packaging/vsmlrt_build.py
      - README.md
      - scripts/module_common.py
      - tests/test_wheel_versions.py
      - tests/module-snapshots.json
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install hatchling packaging
      - run: python -m unittest discover -s tests -p test_wheel_versions.py -v

name: Package - vapoursynth-tcanny

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['vapoursynth-tcanny-v*']
    paths:
      - plugins/vapoursynth-tcanny/**
      - .github/workflows/package-vapoursynth-tcanny.yml
  pull_request:
    paths:
      - plugins/vapoursynth-tcanny/**
      - .github/workflows/package-vapoursynth-tcanny.yml
  workflow_dispatch:

jobs:
  windows-x86_64:
    name: Build - Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugins/vapoursynth-tcanny
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package tools and runtime
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install "VapourSynth==79" build hatchling packaging py7zr
      - name: Build the Windows Release-backed wheel
        shell: powershell
        run: |
          python -m build --wheel --outdir dist/wheels-win
          $wheel = Get-ChildItem dist\wheels-win\*.whl | Select-Object -First 1 -ExpandProperty FullName
          if (-not $wheel) { throw 'TCanny Windows wheel was not produced' }
          python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall('dist/windows-wheel')" $wheel
          New-Item -ItemType Directory -Force dist\windows-x86_64 | Out-Null
          Move-Item dist\windows-wheel\vapoursynth\plugins\tcanny dist\windows-x86_64\tcanny
      - name: Explicitly smoke test package output
        shell: powershell
        run: python tools\ci_smoke_package.py --artifact-dir dist\windows-x86_64\tcanny --json
      - name: Create and smoke test Windows Release zip
        shell: powershell
        run: |
          python tools\ci_make_release_assets.py --package-dir dist\windows-x86_64\tcanny --wheel-dir dist\wheels-win --out-dir dist\release-assets-win --zip-name tcanny-windows-x86_64.zip --clean
          python tools\ci_smoke_package.py --artifact-zip dist\release-assets-win\tcanny-windows-x86_64.zip --json
      - name: Smoke test installed Windows wheel autoload
        shell: powershell
        run: |
          $wheel = Get-ChildItem dist\wheels-win\*.whl | Select-Object -First 1 -ExpandProperty FullName
          python -m pip install --force-reinstall --no-deps $wheel
          python tools\ci_smoke_installed_wheel.py --json
      - name: Smoke test source install through established Windows payload
        shell: powershell
        run: |
          python -m pip uninstall -y vapoursynth-tcanny
          python -m pip install --force-reinstall --no-deps -v .
          python tools\ci_smoke_installed_wheel.py --json
      - uses: actions/upload-artifact@v4
        with:
          name: tcanny-release-assets-windows
          path: plugins/vapoursynth-tcanny/dist/release-assets-win
          if-no-files-found: error

  linux-x86_64:
    name: Build - Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build against extracted R79 headers in manylinux
        shell: bash
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/plugins/vapoursynth-tcanny:/workspace" -w /workspace \
            quay.io/pypa/manylinux2014_x86_64 bash -lc '
              set -exo pipefail
              py=/opt/python/cp312-cp312/bin/python
              source /opt/rh/devtoolset-10/enable
              set -u
              export PATH="/opt/python/cp312-cp312/bin:$PATH"
              "$py" -m pip install --upgrade pip
              "$py" -m pip install build hatchling packaging meson ninja py7zr
              mkdir -p _deps/vapoursynth-wheel dist/wheels-linux dist/linux-x86_64 /tmp/unrelated-pkgconfig
              "$py" -m pip download --only-binary=:all: --no-deps \
                --platform manylinux_2_27_x86_64 --implementation cp --python-version 312 --abi abi3 \
                "VapourSynth==79" -d _deps/vapoursynth-wheel
              unzip -q _deps/vapoursynth-wheel/*.whl -d _deps/vapoursynth-wheel/extracted
              export TCANNY_VAPOURSYNTH_ROOT=/workspace/_deps/vapoursynth-wheel/extracted/vapoursynth
              export PKG_CONFIG_PATH=/tmp/unrelated-pkgconfig
              export TCANNY_FORCE_BUILD=1
              export TCANNY_PLATFORM_TAG=manylinux_2_27_x86_64
              "$py" -m build --wheel --no-isolation --skip-dependency-check --outdir dist/wheels-linux
              wheel=$(find dist/wheels-linux -name "*.whl" -print -quit)
              test -n "$wheel"
              [[ "$wheel" == *manylinux_2_27_x86_64.whl ]]
              unzip -q "$wheel" "vapoursynth/plugins/tcanny/*" -d dist/linux-x86_64/extracted
              mv dist/linux-x86_64/extracted/vapoursynth/plugins/tcanny dist/linux-x86_64/tcanny
              "$py" tools/ci_make_release_assets.py --package-dir dist/linux-x86_64/tcanny --wheel-dir dist/wheels-linux --out-dir dist/release-assets-linux --zip-name tcanny-linux-x86_64.zip --clean
              if readelf --version-info dist/linux-x86_64/tcanny/tcanny.so | grep -Eq "GLIBC_(2\\.(1[89]|[2-9][0-9])|[3-9][0-9]*\\.)"; then
                echo "TCanny exceeds the conservative GLIBC 2.17 plugin ABI ceiling"
                exit 1
              fi
            '
      - uses: actions/upload-artifact@v4
        with:
          name: tcanny-release-assets-linux
          path: plugins/vapoursynth-tcanny/dist/release-assets-linux
          if-no-files-found: error

  linux-runtime-smoke:
    name: Test - Linux release payload
    needs: linux-x86_64
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/vapoursynth-tcanny
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tcanny-release-assets-linux
          path: plugins/vapoursynth-tcanny/dist/release-assets-linux
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install R79 runtime
        shell: bash
        run: python -m pip install --upgrade pip "VapourSynth==79"
      - name: Smoke installed Linux wheel autoload
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --force-reinstall --no-deps dist/release-assets-linux/*.whl
          python tools/ci_smoke_installed_wheel.py --json
      - name: Explicitly smoke test Linux Release zip
        shell: bash
        run: python tools/ci_smoke_package.py --artifact-zip dist/release-assets-linux/tcanny-linux-x86_64.zip --json
      - name: Test isolated source install through the Linux Release asset
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip uninstall -y vapoursynth-tcanny
          export TCANNY_PREBUILT_URL="$GITHUB_WORKSPACE/plugins/vapoursynth-tcanny/dist/release-assets-linux/tcanny-linux-x86_64.zip"
          python -m pip install --force-reinstall --no-deps -v . 2>&1 | tee pip-release.log
          grep -F 'TCanny wheel build: using prebuilt release asset' pip-release.log
          python tools/ci_smoke_installed_wheel.py --json
      - name: Test isolated source fallback with unrelated PKG_CONFIG_PATH
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip uninstall -y vapoursynth-tcanny
          mkdir -p .ci-unrelated-pkgconfig
          export TCANNY_FORCE_BUILD=1
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/.ci-unrelated-pkgconfig"
          python -m pip install --force-reinstall --no-deps -v .
          python tools/ci_smoke_installed_wheel.py --json

  publish-release:
    name: Publish - GitHub Release
    if: startsWith(github.ref, 'refs/tags/vapoursynth-tcanny-v')
    needs: [windows-x86_64, linux-runtime-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tcanny-release-assets-*
          path: release-assets
          merge-multiple: true
      - name: Assert exact release asset inventory
        shell: bash
        run: |
          set -euxo pipefail
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort | tee assets.txt
          test "$(wc -l < assets.txt)" -eq 4
          grep -Ex 'tcanny-windows-x86_64\.zip' assets.txt
          grep -Ex 'tcanny-linux-x86_64\.zip' assets.txt
          grep -Ex 'vapoursynth_tcanny-14\.1-py3-none-win_amd64\.whl' assets.txt
          grep -Ex 'vapoursynth_tcanny-14\.1-py3-none-manylinux_2_27_x86_64\.whl' assets.txt
      - name: Publish all verified assets once
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euxo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --title "$GITHUB_REF_NAME" --notes "Automated Release payload for $GITHUB_REF_NAME." --repo "$GITHUB_REPOSITORY"
          fi
      - name: Smoke fresh named remote VCS install from the published Linux asset
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm -e TCANNY_TAG="$GITHUB_REF_NAME" \
            -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            -e TCANNY_PREBUILT_REPOSITORY="$GITHUB_REPOSITORY" \
            -e TCANNY_PREBUILT_TAG="$GITHUB_REF_NAME" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            python:3.13-bookworm bash -lc '
            set -euxo pipefail
            apt-get update
            apt-get install -y --no-install-recommends git
            python -m pip install --upgrade pip "VapourSynth==79"
            python -m pip install -v "vapoursynth-tcanny @ git+https://github.com/${GITHUB_REPOSITORY}.git@${TCANNY_TAG}#subdirectory=plugins/vapoursynth-tcanny" 2>&1 | tee /tmp/pip-vcs.log
            grep -F "TCanny wheel build: using prebuilt release asset" /tmp/pip-vcs.log
            python plugins/vapoursynth-tcanny/tools/ci_smoke_installed_wheel.py --json
          '
      - name: Refresh package index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh api "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=index

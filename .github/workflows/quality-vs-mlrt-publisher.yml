name: Quality - vs-mlrt publisher

on:
  pull_request:
    paths:
      - scripts/publish_vsmlrt.py
      - scripts/publish_module.py
      - scripts/module_common.py
      - tests/test_vsmlrt_release.py
      - plugins/vs-mlrt/tools/assemble_component_release.py
      - plugins/vs-mlrt/tools/test_release_assembly.py
      - .github/workflows/publish-vs-mlrt.yml
      - .github/workflows/quality-vs-mlrt-publisher.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-modules.txt
      - run: python -m unittest discover -s tests -p test_vsmlrt_release.py -v
      - run: python -m unittest discover -s plugins/vs-mlrt/tools -p test_release_assembly.py -v

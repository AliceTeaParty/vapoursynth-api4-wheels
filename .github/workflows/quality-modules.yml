name: Quality - Python module packaging

on:
  push:
    branches: [main]
    paths:
      - modules/**
      - scripts/*module*.py
      - scripts/requirements-modules.txt
      - tests/test_modules.py
      - tests/test_generate_index.py
      - .github/workflows/*modules.yml
      - .github/workflows/submit-module-update.yml
  pull_request:
    paths:
      - modules/**
      - scripts/*module*.py
      - scripts/requirements-modules.txt
      - tests/test_modules.py
      - tests/test_generate_index.py
      - .github/workflows/*modules.yml
      - .github/workflows/submit-module-update.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r scripts/requirements-modules.txt hatchling==1.27.0
      - run: python -m unittest discover -s tests -p test_modules.py -v
      - run: python -m unittest discover -s tests -p test_generate_index.py -v

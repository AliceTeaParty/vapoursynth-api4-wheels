name: Quality - Collection subtrees

on:
  pull_request:
    paths:
      - modules/**
      - scripts/*collection*.py
      - scripts/validate_module_wheel.py
      - scripts/smoke_installed_module.py
      - tests/test_collection.py
      - VERSIONS.md
      - .gitattributes
      - .github/workflows/*collection*.yml
  push:
    branches: [main]
    paths:
      - modules/**
      - scripts/*collection*.py
      - scripts/validate_module_wheel.py
      - scripts/smoke_installed_module.py
      - tests/test_collection.py
      - VERSIONS.md
      - .gitattributes
      - .github/workflows/*collection*.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            modules
            scripts
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements-modules.txt
      - run: python -m unittest discover -s tests -p test_collection.py -v
  wheel-set:
    uses: ./.github/workflows/package-vs-collection-rk.yml

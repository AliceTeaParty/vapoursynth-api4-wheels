name: Package - vapoursynth-fft3dfilter

on:
  push:
    branches:
      - main
    tags:
      - 'vapoursynth-fft3dfilter-v*'
    paths:
      - plugins/vapoursynth-fft3dfilter/**
      - .github/workflows/package-vapoursynth-fft3dfilter.yml
  pull_request:
    paths:
      - plugins/vapoursynth-fft3dfilter/**
      - .github/workflows/package-vapoursynth-fft3dfilter.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build - Windows x86_64
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
        working-directory: plugins/vapoursynth-fft3dfilter
    steps:
      - uses: actions/checkout@v4
      - name: Set up CPython
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python tools
        shell: cmd
        run: >-
          "%pythonLocation%\python.exe" -m pip install --upgrade pip build hatchling packaging meson ninja
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-fftw
      - name: Prepare VapourSynth R77 wheel
        shell: cmd
        run: >-
          "%pythonLocation%\python.exe" tools\ci_prepare_msys2.py
      - name: Build plugin
        run: /ucrt64/bin/python tools/ci_build_msys2.py --clean
      - name: Smoke-load artifact
        shell: cmd
        run: >-
          "%pythonLocation%\python.exe" tools\smoke_load_artifact.py
          --vapoursynth-root _deps\vapoursynth-wheel-R77
          --artifact-dir dist\msys2-ucrt64
          --exercise-filter
      - name: Smoke-load artifact through manifest autoload
        shell: cmd
        run: >-
          "%pythonLocation%\python.exe" tools\smoke_load_artifact.py
          --vapoursynth-root _deps\vapoursynth-wheel-R77
          --artifact-dir dist\msys2-ucrt64
          --autoload
          --exercise-filter
      - name: Pack and check release zip
        shell: cmd
        run: |
          "%pythonLocation%\python.exe" tools\package_plugin_zip.py --input-dir dist\msys2-ucrt64 --output dist\fft3dfilter-msys2-ucrt64.zip
          "%pythonLocation%\python.exe" tools\check_package_layout.py dist\fft3dfilter-msys2-ucrt64.zip --plugin-dll fft3dfilter.dll --require-manifest --require-top-level-dir --forbid-vapoursynth-prefix
      - name: Build wheel from local prebuilt package
        shell: cmd
        env:
          FFT3DFILTER_PREBUILT_URL: ${{ github.workspace }}\plugins\vapoursynth-fft3dfilter\dist\fft3dfilter-msys2-ucrt64.zip
        run: >-
          "%pythonLocation%\python.exe" -m build --wheel --no-isolation --skip-dependency-check --outdir dist\wheels
      - name: Install and smoke-test wheel
        shell: cmd
        run: |
          for %%I in (dist\wheels\*.whl) do "%pythonLocation%\python.exe" -m pip install --force-reinstall "%%~fI"
          "%pythonLocation%\python.exe" tools\smoke_installed_wheel.py --exercise-filter
      - name: Upload Windows release zip
        uses: actions/upload-artifact@v4
        with:
          name: fft3dfilter-windows-release
          path: plugins/vapoursynth-fft3dfilter/dist/fft3dfilter-msys2-ucrt64.zip
          if-no-files-found: error
      - name: Upload Windows wheel
        uses: actions/upload-artifact@v4
        with:
          name: fft3dfilter-windows-wheel
          path: plugins/vapoursynth-fft3dfilter/dist/wheels/*.whl
          if-no-files-found: error

  build-linux:
    name: Build - Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build in conservative glibc environment
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/plugins/vapoursynth-fft3dfilter:/src" -w /src quay.io/pypa/manylinux2014_x86_64 bash -lc '
            set -euxo pipefail
            py=/opt/python/cp313-cp313/bin/python
            "$py" -m pip install --upgrade pip meson ninja
            mkdir -p /tmp/vs-wheel /tmp/vs-root
            curl -fsSL https://files.pythonhosted.org/packages/c2/82/a4f5e879ff0bb6722ecbecf01482b0783ed05d42aefa7717e6a6f4f77180/vapoursynth-79-cp312-abi3-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl -o /tmp/vs-wheel/vapoursynth-79.whl
            echo "6f1e37f0ed8eb73e61c3c231fd7f7a0f7acfa893e98d026686e9c81e52c9ce06  /tmp/vs-wheel/vapoursynth-79.whl" | sha256sum -c -
            unzip -q /tmp/vs-wheel/vapoursynth-79.whl -d /tmp/vs-root
            mkdir -p /tmp/fftw-src
            curl -fsSL https://fftw.org/fftw-3.3.10.tar.gz | tar -xz -C /tmp/fftw-src --strip-components=1
            cd /tmp/fftw-src
            ./configure --prefix=/tmp/fftw --disable-shared --enable-static --enable-float --enable-threads --disable-fortran --with-pic
            make -j"$(nproc)"
            make install
            cd /src
            "$py" tools/build_linux_release.py --vapoursynth-root /tmp/vs-root --fftw-prefix /tmp/fftw --static-runtime
            "$py" tools/package_plugin_zip.py --input-dir dist/linux-x86_64 --output dist/fft3dfilter-linux-x86_64.zip --plugin-file fft3dfilter.so
            "$py" tools/check_package_layout.py dist/fft3dfilter-linux-x86_64.zip --plugin-dll fft3dfilter.so --require-manifest --require-top-level-dir --forbid-vapoursynth-prefix
            readelf --version-info dist/linux-x86_64/fft3dfilter/fft3dfilter.so | tee dist/linux-readelf-version-info.txt
          '
      - name: Upload Linux release zip
        uses: actions/upload-artifact@v4
        with:
          name: fft3dfilter-linux-release
          path: plugins/vapoursynth-fft3dfilter/dist/fft3dfilter-linux-x86_64.zip
          if-no-files-found: error
      - name: Upload Linux ABI report
        uses: actions/upload-artifact@v4
        with:
          name: fft3dfilter-linux-diagnostics
          path: plugins/vapoursynth-fft3dfilter/dist/linux-readelf-version-info.txt
          if-no-files-found: error

  verify-linux:
    name: Test - Linux release payload
    needs: build-linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: plugins/vapoursynth-fft3dfilter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: fft3dfilter-linux-release
          path: plugins/vapoursynth-fft3dfilter/dist
      - name: Build the R79 validation image
        run: docker build -t fft3dfilter-vs79-validation -f tools/linux-validation.Dockerfile .
      - name: Build manylinux-tagged wheel from release payload
        run: |
          python -m pip install --upgrade build
          FFT3DFILTER_PREBUILT_URL="$PWD/dist/fft3dfilter-linux-x86_64.zip" FFT3DFILTER_WHEEL_PLATFORM_TAG=manylinux_2_27_x86_64 python -m build --wheel --outdir dist/wheels
          unzip -l dist/wheels/*.whl
      - name: Explicitly load Linux Release payload
        run: |
          docker run --rm -v "$PWD:/workspace:ro" fft3dfilter-vs79-validation bash -lc 'python /workspace/tools/smoke_linux_package.py --artifact-zip /workspace/dist/fft3dfilter-linux-x86_64.zip'
      - name: Install Release-backed wheel and test manifest autoload
        run: |
          docker run --rm -v "$PWD:/workspace:ro" fft3dfilter-vs79-validation bash -lc 'python -m pip install --no-deps /workspace/dist/wheels/*.whl && python /workspace/tools/smoke_linux_package.py --installed-wheel'
      - name: Force an isolated native fallback with unrelated pkg-config metadata
        run: |
          docker run --rm -v "$PWD:/workspace:ro" fft3dfilter-vs79-validation bash -lc '
            set -euxo pipefail
            apt-get update
            apt-get install -y libfftw3-dev
            cp -a /workspace /src
            mkdir -p /tmp/unrelated-pkgconfig
            FFT3DFILTER_FORCE_BUILD=1 PKG_CONFIG_PATH=/tmp/unrelated-pkgconfig python -m pip install --no-deps --force-reinstall -v /src
            python /src/tools/smoke_linux_package.py --installed-wheel
          '
      - name: Upload Linux wheel
        uses: actions/upload-artifact@v4
        with:
          name: fft3dfilter-linux-wheel
          path: plugins/vapoursynth-fft3dfilter/dist/wheels/*.whl
          if-no-files-found: error

  publish:
    name: Publish - GitHub Release
    if: startsWith(github.ref, 'refs/tags/vapoursynth-fft3dfilter-v')
    needs: [build-windows, verify-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fft3dfilter-*-release
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: fft3dfilter-*-wheel
          path: release-assets
          merge-multiple: true
      - name: Assert exact release asset inventory
        run: |
          set -euxo pipefail
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort | tee assets.txt
          test "$(wc -l < assets.txt)" -eq 4
          grep -Ex 'fft3dfilter-msys2-ucrt64.zip' assets.txt
          grep -Ex 'fft3dfilter-linux-x86_64.zip' assets.txt
          grep -Ex 'vapoursynth_fft3dfilter-2\.1-py3-none-win_amd64\.whl' assets.txt
          grep -Ex 'vapoursynth_fft3dfilter-2\.1-py3-none-manylinux_2_27_x86_64\.whl' assets.txt
      - name: Publish GitHub release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release-assets/* --title "$tag" --notes "Automated release for $tag." --repo "$GITHUB_REPOSITORY"
          fi
          gh api "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=index

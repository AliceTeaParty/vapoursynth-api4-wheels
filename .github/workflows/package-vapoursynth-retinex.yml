name: Package - vapoursynth-retinex

on:
  push:
    branches: [main]
    tags: ["vapoursynth-retinex-v*"]
    paths:
      - plugins/vapoursynth-retinex/**
      - .github/workflows/package-vapoursynth-retinex.yml
  pull_request:
    paths:
      - plugins/vapoursynth-retinex/**
      - .github/workflows/package-vapoursynth-retinex.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retinex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-ucrt64:
    name: Build - Windows x86_64 UCRT64
    runs-on: windows-2025

    defaults:
      run:
        shell: msys2 {0}
        working-directory: plugins/vapoursynth-retinex

    steps:
      - uses: actions/checkout@v5

      - name: Set up CPython
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python tools
        shell: cmd
        run: >-
          "%pythonLocation%\python.exe" -m pip install --upgrade pip build hatchling packaging meson ninja VapourSynth==79

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Prepare VapourSynth wheel SDK
        shell: cmd
        run: >-
          "%pythonLocation%\python.exe" tools\ci_prepare_msys2.py

      - name: Build plugin package
        run: /ucrt64/bin/python tools/ci_build_msys2.py --clean

      - name: Smoke-load packaged plugin
        shell: cmd
        run: >-
          "%pythonLocation%\python.exe" tools\smoke_load_artifact.py
          --vapoursynth-root _deps\vapoursynth-wheel-R77
          --artifact-dir dist\msys2-ucrt64
          --exercise-filter

      - name: Pack Windows release zip
        shell: cmd
        run: >-
          "%pythonLocation%\python.exe" tools\package_plugin_zip.py
          --input-dir dist\msys2-ucrt64
          --output dist\retinex-msys2-ucrt64.zip

      - name: Build wheel from tested Windows payload
        shell: cmd
        env:
          RETINEX_PREBUILT_URL: ${{ github.workspace }}\plugins\vapoursynth-retinex\dist\retinex-msys2-ucrt64.zip
        run: >-
          "%pythonLocation%\python.exe" -m build --wheel --no-isolation --outdir dist\wheels

      - name: Install and smoke test Windows wheel
        shell: cmd
        run: |
          for %%I in (dist\wheels\*.whl) do "%pythonLocation%\python.exe" -m pip install --force-reinstall "%%~fI"
          "%pythonLocation%\python.exe" tools\ci_smoke_installed_wheel.py --json

      - name: Create Windows release assets
        shell: cmd
        run: >-
          "%pythonLocation%\python.exe" tools\ci_make_release_assets.py
          --clean --package-dir dist\msys2-ucrt64\retinex --wheel-dir dist\wheels
          --out-dir dist\release-assets --zip-name retinex-msys2-ucrt64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: retinex-release-assets-windows
          path: plugins/vapoursynth-retinex/dist/release-assets
          if-no-files-found: error

  linux-x86_64:
    name: Build - Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build conservative Linux wheel and payload
        shell: bash
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/plugins/vapoursynth-retinex:/workspace" -w /workspace \
            quay.io/pypa/manylinux2014_x86_64 bash -lc '
              set -exo pipefail
              py=/opt/python/cp313-cp313/bin/python
              source /opt/rh/devtoolset-10/enable
              set -u
              export PATH="/opt/python/cp313-cp313/bin:$PATH"
              "$py" -m pip install --upgrade pip build hatchling packaging meson ninja
              mkdir -p _deps/vapoursynth-wheel dist/wheels-linux dist/linux-x86_64
              "$py" -m pip download --only-binary=:all: --no-deps \
                --platform manylinux_2_27_x86_64 --implementation cp --python-version 313 --abi abi3 \
                VapourSynth==79 -d _deps/vapoursynth-wheel
              unzip -q _deps/vapoursynth-wheel/*.whl -d _deps/vapoursynth-wheel/extracted
              export PKG_CONFIG_PATH="/workspace/_deps/vapoursynth-wheel/extracted/vapoursynth/pkgconfig"
              export RETINEX_FORCE_BUILD=1
              export RETINEX_PLATFORM_TAG=manylinux_2_27_x86_64
              "$py" -m build --wheel --no-isolation --skip-dependency-check --outdir dist/wheels-linux
              wheel=$(find dist/wheels-linux -name "*.whl" -print -quit)
              test -n "$wheel"
              unzip -q "$wheel" "vapoursynth/plugins/retinex/*" -d dist/linux-x86_64/extracted
              mv dist/linux-x86_64/extracted/vapoursynth/plugins/retinex dist/linux-x86_64/retinex
              "$py" tools/ci_make_release_assets.py --clean \
                --package-dir dist/linux-x86_64/retinex --wheel-dir dist/wheels-linux \
                --out-dir dist/release-assets-linux --zip-name retinex-linux-x86_64.zip
              "$py" -c "import re, subprocess; out = subprocess.check_output([\"readelf\", \"--version-info\", \"dist/linux-x86_64/retinex/retinex.so\"], text=True); versions = [tuple(map(int, value.split(\".\"))) for value in re.findall(r\"GLIBC_(\\d+\\.\\d+)\", out)]; assert all(version <= (2, 17) for version in versions), versions"
            '

      - uses: actions/upload-artifact@v4
        with:
          name: retinex-release-assets-linux
          path: plugins/vapoursynth-retinex/dist/release-assets-linux
          if-no-files-found: error

  linux-runtime-smoke:
    name: Test - Linux release payload
    needs: linux-x86_64
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/vapoursynth-retinex

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: retinex-release-assets-linux
          path: plugins/vapoursynth-retinex/dist/release-assets-linux

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install and smoke test released wheel
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip VapourSynth==79
          python -m pip install --force-reinstall --no-deps dist/release-assets-linux/*.whl
          python tools/ci_smoke_installed_wheel.py --json

      - name: Explicitly smoke test Linux release zip
        shell: bash
        run: python tools/ci_smoke_package.py --artifact-zip dist/release-assets-linux/retinex-linux-x86_64.zip --json

      - name: Smoke PEP 517 release-backed and force-build source installs
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip uninstall -y vapoursynth-retinex
          RETINEX_PREBUILT_URL="$GITHUB_WORKSPACE/plugins/vapoursynth-retinex/dist/release-assets-linux/retinex-linux-x86_64.zip" \
            python -m pip install --force-reinstall --no-deps -v . 2>&1 | tee prebuilt-install.log
          grep -F "Retinex wheel build: using prebuilt release asset" prebuilt-install.log
          python tools/ci_smoke_installed_wheel.py --json
          python -m pip uninstall -y vapoursynth-retinex
          RETINEX_FORCE_BUILD=1 PKG_CONFIG_PATH=/opt/unrelated \
            python -m pip install --force-reinstall --no-deps -v . 2>&1 | tee fallback-install.log
          grep -F "RETINEX_FORCE_BUILD is set" fallback-install.log
          python tools/ci_smoke_installed_wheel.py --json

  publish-release:
    name: Publish - GitHub Release
    if: startsWith(github.ref, 'refs/tags/vapoursynth-retinex-v')
    needs: [windows-ucrt64, linux-runtime-smoke]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: retinex-release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Assert exact release asset inventory
        shell: bash
        run: |
          set -euxo pipefail
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort | tee assets.txt
          test "$(wc -l < assets.txt)" -eq 4
          grep -Ex 'retinex-msys2-ucrt64.zip' assets.txt
          grep -Ex 'retinex-linux-x86_64.zip' assets.txt
          grep -Ex 'vapoursynth_retinex-4\.1-py3-none-win_amd64\.whl' assets.txt
          grep -Ex 'vapoursynth_retinex-4\.1-py3-none-manylinux_2_27_x86_64\.whl' assets.txt

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release-assets/* --title "$tag" --notes "Automated release for $tag." --repo "$GITHUB_REPOSITORY"
          fi
          gh api "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=index

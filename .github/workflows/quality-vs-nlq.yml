name: Quality - vs-nlq

on:
  push:
    branches: [main]
    paths:
      - plugins/vs-nlq/**
      - .github/workflows/quality-vs-nlq.yml
  pull_request:
    branches: [main]
    paths:
      - plugins/vs-nlq/**
      - .github/workflows/quality-vs-nlq.yml

jobs:
  quality:
    name: Check - Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/vs-nlq
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust, clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check
        run: |
          cargo check --workspace --all-features

      - name: Rustfmt
        run: |
          cargo fmt --all --check

      - name: Clippy
        run: |
          cargo clippy --workspace --all-features --all-targets --tests -- --deny warnings

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vstaambk"
version = "0.3.0.post2+alice.1"
description = "TAAmbk from the RyougiKukoc script collection"
requires-python = ">=3.12"
readme = "WHEEL-README.md"
dependencies = []
license-files = []

[project.urls]
Upstream = "https://github.com/HomeOfVapourSynthEvolution/vsTAAmbk"
Collection = "https://github.com/RyougiKukoc/VapourSynth-Scripts-Collection"
Wheels = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/tree/main/modules/vstaambk"

[tool.hatch.build.targets.wheel]
only-include = ["vsTAAmbk.py"]

[tool.hatch.build.targets.wheel.extra-metadata]
"provenance.toml" = "provenance.toml"

[tool.hatch.build.targets.sdist]
include = ["/vsTAAmbk.py", "/pyproject.toml", "/provenance.toml", "/WHEEL-README.md"]

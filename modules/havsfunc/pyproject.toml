[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "havsfunc"
version = "33.post2+alice.1"
description = "havsfunc from the RyougiKukoc script collection"
requires-python = ">=3.12"
readme = "WHEEL-README.md"
dependencies = []
license-files = ["LICENSE"]

[project.urls]
Upstream = "https://github.com/HomeOfVapourSynthEvolution/havsfunc"
Collection = "https://github.com/RyougiKukoc/VapourSynth-Scripts-Collection"
Wheels = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/tree/main/modules/havsfunc"

[tool.hatch.build.targets.wheel]
only-include = ["havsfunc.py"]

[tool.hatch.build.targets.wheel.extra-metadata]
"provenance.toml" = "provenance.toml"

[tool.hatch.build.targets.sdist]
include = ["/havsfunc.py", "/pyproject.toml", "/provenance.toml", "/WHEEL-README.md", "/LICENSE"]

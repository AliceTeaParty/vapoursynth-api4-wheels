[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nnedi3-rpow2"
version = "1.1.0.post1"
description = "nnedi3_rpow2 from the RyougiKukoc script collection"
requires-python = ">=3.12"
readme = "WHEEL-README.md"
dependencies = []
license-files = []

[project.urls]
Upstream = "https://gist.github.com/4re/342624c9e1a144a696c6"
Collection = "https://github.com/RyougiKukoc/VapourSynth-Scripts-Collection"
Wheels = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/tree/main/modules/nnedi3-rpow2"

[tool.hatch.build.targets.wheel]
only-include = ["nnedi3_rpow2.py"]

[tool.hatch.build.targets.wheel.extra-metadata]
"provenance.toml" = "provenance.toml"

[tool.hatch.build.targets.sdist]
include = ["/nnedi3_rpow2.py", "/pyproject.toml", "/provenance.toml", "/WHEEL-README.md"]

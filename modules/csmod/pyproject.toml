[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "csmod"
version = "0.3.0.post2+alice.1"
description = "CSMOD from the RyougiKukoc script collection"
requires-python = ">=3.12"
readme = "WHEEL-README.md"
dependencies = []
license-files = []

[project.urls]
Upstream = "https://github.com/fdar0536/VapourSynth-Contra-Sharpen-mod"
Collection = "https://github.com/RyougiKukoc/VapourSynth-Scripts-Collection"
Wheels = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/tree/main/modules/csmod"

[tool.hatch.build.targets.wheel]
only-include = ["_vs_collection_rk_csmod.pth"]

[tool.hatch.build.targets.wheel.force-include]
"CSMOD.py" = "_vs_collection_rk_runtime/CSMOD.py"

[tool.hatch.build.targets.wheel.extra-metadata]
"provenance.toml" = "provenance.toml"

[tool.hatch.build.targets.sdist]
include = ["/_vs_collection_rk_csmod.pth", "/CSMOD.py", "/pyproject.toml", "/provenance.toml", "/WHEEL-README.md"]

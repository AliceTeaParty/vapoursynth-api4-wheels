[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vs-collection-rk"
version = "0.4.1+alice.1"
description = "Pinned entry package for the RyougiKukoc VapourSynth script collection"
requires-python = ">=3.12"
readme = "README.md"
dependencies = ["sdering-fix==0.3.0.post1+alice.1", "csmod==0.3.0.post1+alice.1", "nnedi3-resample==2.post1+alice.1", "nnedi3-rpow2==1.1.0.post1+alice.1", "havsfunc==33.post2+alice.1", "getfnative==0.3.0.post1+alice.1", "mvsfunc==11.post1+alice.1", "muvsfunc==0.3.0.post1+alice.1", "fvsfunc==0.3.0.post2+alice.1", "vstaambk==0.3.0.post2+alice.1", "kagefunc==0.3.0.post1+alice.1", "yvsfunc==0.3.0.post2+alice.1"]

[project.urls]
Source = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/tree/main/modules"
Collection = "https://github.com/RyougiKukoc/VapourSynth-Scripts-Collection"

[tool.hatch.build.targets.wheel]
packages = ["vs_collection_rk"]

[tool.hatch.build.targets.sdist]
include = ["/vs_collection_rk", "/pyproject.toml", "/README.md"]

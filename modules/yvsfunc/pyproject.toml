[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "yvsfunc"
version = "0.3.0.post3+alice.1"
description = "yvsfunc from the RyougiKukoc script collection"
requires-python = ">=3.12"
readme = "WHEEL-README.md"
dependencies = []
license-files = ["COPYING"]

[project.urls]
Upstream = "https://github.com/YomikoR/yvsfunc"
Collection = "https://github.com/RyougiKukoc/VapourSynth-Scripts-Collection"
Wheels = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/tree/main/modules/yvsfunc"

[tool.hatch.build.targets.wheel]
only-include = ["_vs_collection_rk_yvsfunc.pth"]

[tool.hatch.build.targets.wheel.force-include]
"yvsfunc" = "_vs_collection_rk_runtime/yvsfunc"

[tool.hatch.build.targets.wheel.extra-metadata]
"provenance.toml" = "provenance.toml"

[tool.hatch.build.targets.sdist]
include = ["/_vs_collection_rk_yvsfunc.pth", "/yvsfunc", "/pyproject.toml", "/provenance.toml", "/WHEEL-README.md", "/COPYING"]

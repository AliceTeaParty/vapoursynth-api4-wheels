[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fvsfunc"
version = "0.3.0.post3+alice.1"
description = "fvsfunc from the RyougiKukoc script collection"
requires-python = ">=3.12"
readme = "WHEEL-README.md"
dependencies = []
license-files = []

[project.urls]
Upstream = "https://github.com/Irrational-Encoding-Wizardry/fvsfunc"
Collection = "https://github.com/RyougiKukoc/VapourSynth-Scripts-Collection"
Wheels = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/tree/main/modules/fvsfunc"

[tool.hatch.build.targets.wheel]
only-include = ["_vs_collection_rk_fvsfunc.pth"]

[tool.hatch.build.targets.wheel.force-include]
"fvsfunc.py" = "_vs_collection_rk_runtime/fvsfunc.py"

[tool.hatch.build.targets.wheel.extra-metadata]
"provenance.toml" = "provenance.toml"

[tool.hatch.build.targets.sdist]
include = ["/_vs_collection_rk_fvsfunc.pth", "/fvsfunc.py", "/pyproject.toml", "/provenance.toml", "/WHEEL-README.md"]

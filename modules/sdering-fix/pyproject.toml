[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sdering-fix"
version = "0.3.0.post1+alice.1"
description = "sdering_fix from the RyougiKukoc script collection"
requires-python = ">=3.12"
readme = "WHEEL-README.md"
dependencies = []
license-files = []

[project.urls]
Upstream = "https://gist.github.com/RyougiKukoc/c3832d96a8dce6f609f6e29888af94a6"
Collection = "https://github.com/RyougiKukoc/VapourSynth-Scripts-Collection"
Wheels = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/tree/main/modules/sdering-fix"

[tool.hatch.build.targets.wheel]
only-include = ["sdering_fix.py"]

[tool.hatch.build.targets.wheel.extra-metadata]
"provenance.toml" = "provenance.toml"

[tool.hatch.build.targets.sdist]
include = ["/sdering_fix.py", "/pyproject.toml", "/provenance.toml", "/WHEEL-README.md"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mvsfunc"
version = "11.post1+alice.1"
description = "mvsfunc from the RyougiKukoc script collection"
requires-python = ">=3.12"
readme = "WHEEL-README.md"
dependencies = []
license-files = []

[project.urls]
Upstream = "https://github.com/HomeOfVapourSynthEvolution/mvsfunc"
Collection = "https://github.com/RyougiKukoc/VapourSynth-Scripts-Collection"
Wheels = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/tree/main/modules/mvsfunc"

[tool.hatch.build.targets.wheel]
only-include = ["mvsfunc"]

[tool.hatch.build.targets.wheel.extra-metadata]
"provenance.toml" = "provenance.toml"

[tool.hatch.build.targets.sdist]
include = ["/mvsfunc", "/pyproject.toml", "/provenance.toml", "/WHEEL-README.md"]

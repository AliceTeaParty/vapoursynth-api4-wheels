[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "kagefunc"
version = "0.3.0.post2+alice.1"
description = "kagefunc from the RyougiKukoc script collection"
requires-python = ">=3.12"
readme = "WHEEL-README.md"
dependencies = []
license-files = ["LICENSE"]

[project.urls]
Upstream = "https://github.com/Irrational-Encoding-Wizardry/kagefunc"
Collection = "https://github.com/RyougiKukoc/VapourSynth-Scripts-Collection"
Wheels = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/tree/main/modules/kagefunc"

[tool.hatch.build.targets.wheel]
only-include = ["_vs_collection_rk_kagefunc.pth"]

[tool.hatch.build.targets.wheel.force-include]
"kagefunc.py" = "_vs_collection_rk_runtime/kagefunc.py"

[tool.hatch.build.targets.wheel.extra-metadata]
"provenance.toml" = "provenance.toml"

[tool.hatch.build.targets.sdist]
include = ["/_vs_collection_rk_kagefunc.pth", "/kagefunc.py", "/pyproject.toml", "/provenance.toml", "/WHEEL-README.md", "/LICENSE"]

[build-system]
requires = ["hatchling>=1.30", "packaging>=24", "cmake>=3.20", "ninja", "VapourSynth>=81,<82"]
build-backend = "hatchling.build"

[project]
name = "vapoursynth-krigbilateralvk"
version = "0.2.1+alice.1"
description = "Native Vulkan KrigBilateral chroma reconstruction for VapourSynth R81"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "licenses/GPL.txt"]
requires-python = ">=3.12"
dependencies = ["VapourSynth>=81,<82"]

[project.urls]
"Source Code" = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/tree/main/plugins/vapoursynth-krigbilateralvk"
"Upstream" = "https://github.com/RyougiKukoc/vapoursynth-krigbilateralvk"
"Releases" = "https://github.com/AliceTeaParty/vapoursynth-api4-wheels/releases/tag/vapoursynth-krigbilateralvk-v0.2.1+alice.1"

[tool.hatch.build.targets.wheel]
only-include = ["vapoursynth/plugins/krigbilateralvk"]
artifacts = ["vapoursynth/plugins/krigbilateralvk/**"]

[tool.hatch.build.targets.sdist]
include = ["pyproject.toml", "hatch_build.py", "README.md", "LICENSE", "licenses", "source.json", "native"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
